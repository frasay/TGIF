<body>
<div class="stripe-overlay"></div>
<header class="header">
<div class="header-inner">

<h1 class="logo">Thank God It's <span class="logo-highlight">Frinance</span></h1>

<button class="nav-btn active" data-section="watchlist" onclick="showSection('watchlist')">

<div class="main-inner">

<section class="section-panel visible fade-in" id="section-watchlist">
<div class="section-header">
<h2 class="section-title">✦ Price Dashboard</h2>
</div>
<div class="widget-container" style="height: 460px;">
<div id="watchlist-widget" style="width:100%;height:100%;"></div>
</div>
<div class="widget-container" style="height: 80px; margin-top: 1rem;">
<div id="ticker-tape-widget" style="width:100%;height:100%;"></div>
</div>
</section>

<section class="section-panel" id="section-chart">

<h2 class="section-title">✦ Advanced Chart</h2>

</div>
</div>
<div class="widget-container" style="height: 600px;">
<div id="chart-widget" style="width:100%;height:100%;"></div>
</div>
</section>

</div>
</section>

<div class="section-header">

</div>
</div>

<div class="widget-container" style="height: 380px;">
<div id="fund-profile-widget" style="width:100%;height:100%;"></div>
</div>
<div class="widget-container" style="height: 380px;">
<div id="fund-financials-widget" style="width:100%;height:100%;"></div>
</div>
</div>
<div class="widget-container" style="height: 500px; margin-top: 1rem;">
<div id="fund-chart-widget" style="width:100%;height:100%;"></div>
